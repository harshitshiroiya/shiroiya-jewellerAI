name: CD - Staging

on:
  push:
    branches: [main]

env:
  AZURE_RESOURCE_GROUP: rg-shiroiya-staging
  ACR_NAME: acrshiroiyastaging
  SQL_SERVER_NAME: sql-shiroiya-staging
  SQL_DATABASE_NAME: ShiroiyaJewellerAI
  ENVIRONMENT: staging

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      acr-login-server: ${{ steps.deploy.outputs.acrLoginServer }}
      sql-server-fqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
      api-fqdn: ${{ steps.deploy.outputs.apiFqdn }}
      frontend-fqdn: ${{ steps.deploy.outputs.frontendFqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create Resource Group
        run: az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location centralindia

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: environment=staging sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

  deploy-database:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build DACPAC
        run: dotnet build src/database/ShiroiyaJewellerAI.Database.sqlproj -c Release

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Add runner IP to SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.SQL_SERVER_NAME }} \
            --name github-runner \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Deploy DACPAC
        uses: azure/sql-action@v2.3
        with:
          connection-string: Server=${{ needs.deploy-infra.outputs.sql-server-fqdn }};Initial Catalog=${{ env.SQL_DATABASE_NAME }};User ID=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;
          dacpac-package: src/database/bin/Release/ShiroiyaJewellerAI.Database.dacpac
          action: publish

      - name: Remove runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.SQL_SERVER_NAME }} \
            --name github-runner --yes || true

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [deploy-infra, deploy-database]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/api:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/api:latest \
            ./src/backend
          docker push ${{ env.ACR_NAME }}.azurecr.io/api --all-tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Tailwind CSS
        run: |
          cd src/frontend
          npm ci --legacy-peer-deps
          npx @tailwindcss/cli --input src/input.css --output src/styles.css

      - name: Build and push Frontend image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/frontend:latest \
            ./src/frontend
          docker push ${{ env.ACR_NAME }}.azurecr.io/frontend --all-tags

      - name: Deploy to Container Apps
        run: |
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)

          az containerapp update \
            --name ca-api-shiroiya-staging \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/api:${{ github.sha }} \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=Server=${{ needs.deploy-infra.outputs.sql-server-fqdn }};Database=${{ env.SQL_DATABASE_NAME }};User Id=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;"

          az containerapp registry set \
            --name ca-api-shiroiya-staging \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PASSWORD"

          az containerapp update \
            --name ca-frontend-shiroiya-staging \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} \
            --set-env-vars "API_URL=https://${{ needs.deploy-infra.outputs.api-fqdn }}"

          az containerapp registry set \
            --name ca-frontend-shiroiya-staging \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PASSWORD"
