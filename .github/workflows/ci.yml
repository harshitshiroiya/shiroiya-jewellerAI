name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/backend/ShiroiyaJewellerAI.sln

      - name: Build
        run: dotnet build src/backend/ShiroiyaJewellerAI.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/ShiroiyaJewellerAI.sln --no-build -c Release --verbosity normal

  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build
        run: npx ng build --configuration=production
        working-directory: src/frontend
