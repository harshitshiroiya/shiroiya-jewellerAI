name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/backend/ShiroiyaJewellerAI.sln

      - name: Build
        run: dotnet build src/backend/ShiroiyaJewellerAI.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/ShiroiyaJewellerAI.sln --no-build -c Release --verbosity normal

  database-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build DACPAC
        run: dotnet build src/database/ShiroiyaJewellerAI.Database.sqlproj -c Release

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli --input src/input.css --output src/styles.css
        working-directory: src/frontend

      - name: Build Angular
        run: npx ng build --configuration=production
        working-directory: src/frontend
