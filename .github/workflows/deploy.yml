name: Deploy Infrastructure & Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      branch:
        description: 'Branch to deploy from'
        required: false
        default: 'main'
        type: string

env:
  AZURE_RESOURCE_GROUP: rg-shiroiya-${{ github.event.inputs.environment }}
  AZURE_LOCATION: centralindia
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  ACR_NAME: acrshiroiya${{ github.event.inputs.environment }}
  SQL_SERVER_NAME: sql-shiroiya-${{ github.event.inputs.environment }}
  SQL_DATABASE_NAME: ShiroiyaJewellerAI

jobs:
  # Step 1: Create resource group and deploy all Azure infrastructure
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      acr-login-server: ${{ steps.deploy.outputs.acrLoginServer }}
      frontend-fqdn: ${{ steps.deploy.outputs.frontendFqdn }}
      api-fqdn: ${{ steps.deploy.outputs.apiFqdn }}
      sql-server-fqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=shiroiya-jewellerai environment=${{ env.ENVIRONMENT }}

      - name: Deploy Bicep Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environment=${{ env.ENVIRONMENT }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

  # Step 2: Build DACPAC and deploy database schema
  deploy-database:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build DACPAC
        run: dotnet build src/database/ShiroiyaJewellerAI.Database.sqlproj -c Release

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Add GitHub Actions runner IP to SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.SQL_SERVER_NAME }} \
            --name github-actions-runner \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Install sqlpackage
        run: |
          dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Deploy DACPAC to Azure SQL
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:src/database/bin/Release/ShiroiyaJewellerAI.Database.dacpac \
            /TargetConnectionString:"Server=${{ needs.deploy-infrastructure.outputs.sql-server-fqdn }};Initial Catalog=${{ env.SQL_DATABASE_NAME }};User ID=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;"

      - name: Remove GitHub Actions runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.SQL_SERVER_NAME }} \
            --name github-actions-runner \
            --yes || true

  # Step 3: Build Docker images and push to ACR
  build-images:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build \
            -t ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/api:${{ github.sha }} \
            -t ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/api:latest \
            ./src/backend
          docker push ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/api --all-tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Tailwind CSS
        run: |
          cd src/frontend
          npm ci --legacy-peer-deps
          npx @tailwindcss/cli --input src/input.css --output src/styles.css

      - name: Build and push Frontend image
        run: |
          docker build \
            -t ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/frontend:${{ github.sha }} \
            -t ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/frontend:latest \
            ./src/frontend
          docker push ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/frontend --all-tags

  # Step 4: Deploy container images to Container Apps
  deploy-apps:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-database, build-images]
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Configure ACR registry on Container Apps
        run: |
          az containerapp registry set \
            --name ca-api-shiroiya-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ needs.deploy-infrastructure.outputs.acr-login-server }} \
            --username ${{ env.ACR_NAME }} \
            --password "${{ steps.acr-creds.outputs.password }}"

          az containerapp registry set \
            --name ca-frontend-shiroiya-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ needs.deploy-infrastructure.outputs.acr-login-server }} \
            --username ${{ env.ACR_NAME }} \
            --password "${{ steps.acr-creds.outputs.password }}"

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name ca-api-shiroiya-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/api:${{ github.sha }} \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=Server=${{ needs.deploy-infrastructure.outputs.sql-server-fqdn }};Database=${{ env.SQL_DATABASE_NAME }};User Id=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;" \
              "ASPNETCORE_ENVIRONMENT=${{ env.ENVIRONMENT == 'prod' && 'Production' || 'Development' }}"

      - name: Deploy Frontend Container App
        run: |
          az containerapp update \
            --name ca-frontend-shiroiya-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.deploy-infrastructure.outputs.acr-login-server }}/frontend:${{ github.sha }} \
            --set-env-vars \
              "API_URL=https://${{ needs.deploy-infrastructure.outputs.api-fqdn }}/api/"

      - name: Output deployment URLs
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://${{ needs.deploy-infrastructure.outputs.frontend-fqdn }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://${{ needs.deploy-infrastructure.outputs.api-fqdn }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Server | ${{ needs.deploy-infrastructure.outputs.sql-server-fqdn }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
